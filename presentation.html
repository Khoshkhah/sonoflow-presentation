const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function open_(pass) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false,
                                             ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(BLOB.salt), iterations: BLOB.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  // GCM authenticates, so a wrong passphrase throws here rather than rendering garbage
  const out = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64(BLOB.nonce) }, key, b64(BLOB.data));
  return new TextDecoder().decode(out);
}

document.getElementById("gate").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("go"), msg = document.getElementById("msg");
  btn.disabled = true; msg.textContent = ""; btn.textContent = "Decrypting\u2026";
  try {
    const html = await open_(document.getElementById("pw").value);
    document.open(); document.write(html); document.close();
  } catch (err) {
    msg.textContent = "That passphrase does not open this page.";
    btn.disabled = false; btn.textContent = "Open";
    document.getElementById("pw").select();
  }
});
